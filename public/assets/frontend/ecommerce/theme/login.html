<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Nexara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="assets/css/theme.css" />
</head>
<body>

<div class="auth-page">
  <!-- Background orbs -->
  <div class="auth-bg" aria-hidden="true"></div>

  <div style="position:relative;z-index:1;width:100%;max-width:460px;">
    <!-- Back to shop -->
    <div style="text-align:center;margin-bottom:20px;">
      <a href="index.html" style="font-size:0.85rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px;">
        <i class="bi bi-arrow-left"></i> Back to Nexara
      </a>
    </div>

    <div class="auth-card">
      <!-- Logo -->
      <div class="auth-logo">
        <a href="index.html" class="logo">
          <span class="logo-icon">N</span>
          <span class="logo-text">Nexara</span>
        </a>
      </div>

      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your account to continue shopping</p>

      <!-- Social Sign In -->
      <div class="social-btns">
        <a href="#" class="social-btn" aria-label="Continue with Google">
          <svg class="social-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </a>
        <a href="#" class="social-btn" aria-label="Continue with Facebook">
          <svg class="social-icon" viewBox="0 0 24 24" fill="#1877F2" xmlns="http://www.w3.org/2000/svg">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          Continue with Facebook
        </a>
      </div>

      <div class="auth-divider">or sign in with email</div>

      <!-- Email Sign In Form -->
      <form class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address <span>*</span></label>
          <input class="form-control" id="loginEmail" type="email" placeholder="john@example.com" autocomplete="email" required />
        </div>

        <div class="form-group">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">
            <label class="form-label" for="loginPassword" style="margin:0;">Password <span>*</span></label>
            <a href="#" style="font-size:0.8rem;color:var(--primary);">Forgot password?</a>
          </div>
          <div class="input-icon-wrap">
            <input class="form-control" id="loginPassword" type="password" placeholder="Enter your password" autocomplete="current-password" required />
            <button type="button" class="input-icon" data-password-toggle="loginPassword" aria-label="Toggle password visibility">
              <span class="eye-icon"><i class="bi bi-eye"></i></span>
              <span class="eye-off-icon" style="display:none;"><i class="bi bi-eye-slash"></i></span>
            </button>
          </div>
        </div>

        <label class="form-check">
          <input type="checkbox" />
          <span class="form-check-label">Remember me for 30 days</span>
        </label>

        <button type="submit" class="btn btn-primary btn-xl btn-full">
          <i class="bi bi-box-arrow-in-right"></i> Sign In
        </button>
      </form>

      <p class="auth-footer">
        Don't have an account? <a href="register.html">Create one — it's free</a>
      </p>
    </div>

    <!-- Reassurance -->
    <div style="display:flex;justify-content:center;gap:24px;margin-top:20px;flex-wrap:wrap;">
      <span style="font-size:0.75rem;color:var(--muted);display:flex;align-items:center;gap:5px;"><i class="bi bi-shield-lock" style="color:var(--success);"></i> Secure Login</span>
      <span style="font-size:0.75rem;color:var(--muted);display:flex;align-items:center;gap:5px;"><i class="bi bi-lock" style="color:var(--primary);"></i> 256-bit Encryption</span>
      <span style="font-size:0.75rem;color:var(--muted);display:flex;align-items:center;gap:5px;"><i class="bi bi-eye-slash" style="color:var(--info);"></i> Privacy Protected</span>
    </div>
  </div>
</div>

<script src="assets/js/theme.js"></script>
</body>
</html>
